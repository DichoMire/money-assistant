name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # No secrets, no services: the DB tests run against in-memory /
      # throwaway PGlite (DATABASE_URL must stay unset here).
      - run: npm run test:math
      - run: npm run test:receipt
      - run: npm run test:receipt-db
      - run: npm run test:reliability
      - run: npm run test:account
      - run: npm run test:smoke
