name: receipt-eval
# Manual only: costs LLM money, needs secrets, and model output is not
# perfectly deterministic. Upload the fixtures as an artifact named
# "receipt-fixtures" via a prior manual run or provide them another way —
# they are personal data and never live in the repo.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model override (else the env default ladder)
        required: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: receipt-fixtures
          path: scripts/receipt-fixtures
      - run: npx tsx scripts/receipt-eval.ts ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
